name: Secret Scan

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --report-format sarif --report-path gitleaks.sarif --redact --baseline-path .secrets.allowlist

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

      - name: Summarize secret scan
        shell: bash
        run: |
          COUNT=$(jq '[.runs[].results[]] | length' gitleaks.sarif 2>/dev/null || echo 0)
          echo "## Secret scan summary" >> $GITHUB_STEP_SUMMARY
          echo "Findings: ${COUNT}" >> $GITHUB_STEP_SUMMARY
          if [ "$COUNT" -gt 0 ]; then
            echo "Top findings (first 10):" >> $GITHUB_STEP_SUMMARY
            jq -r '.runs[].results[] | "- " + (.message.text // "secret") + " (" + (.ruleId // "rule") + ")"' gitleaks.sarif | head -n 10 >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: Upload secret scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
